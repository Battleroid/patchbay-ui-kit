<div class="pb-demo-dialog-1">
  <div class="pb-toolbar">
    <button class="pb-btn" data-demo="confirm">Confirm</button>
    <button class="pb-btn pb-btn--danger" data-demo="type"><span class="pb-icon pb-icon--trash"></span>Type to confirm</button>
    <button class="pb-btn" data-pb-open="#dlg-form">Form</button>
    <button class="pb-btn" data-pb-open="#dlg-long">Long</button>
    <button class="pb-btn" data-pb-open="#dlg-drawer"><span class="pb-icon pb-icon--menu"></span>Drawer</button>
  </div>
  <dialog class="pb-dialog pb-dialog--sm pb-demo-dialog-2" open>
    <div class="pb-dialog__head"><span class="pb-dialog__icon" data-status="down"><span class="pb-icon pb-icon--status-down"></span></span><div><h3 class="pb-dialog__title">Delete snapshot?</h3><p class="pb-dialog__sub">tank/media@2026-11-21</p></div></div>
    <div class="pb-dialog__body"><p>Its 212 GB will be removed. This cannot be undone.</p></div>
    <div class="pb-dialog__foot"><button class="pb-btn pb-btn--ghost">Cancel</button><button class="pb-btn pb-btn--danger">Delete</button></div>
  </dialog>
  <dialog class="pb-dialog pb-demo-dialog-2" open>
    <div class="pb-dialog__head"><div><h3 class="pb-dialog__title">New share</h3><p class="pb-dialog__sub">Anyone with the link can download.</p></div><button class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" aria-label="Close"><span class="pb-icon pb-icon--close"></span></button></div>
    <div class="pb-dialog__body"><div class="pb-form">
      <div class="pb-field"><label class="pb-field__label" for="dialog-title">Title</label><span class="pb-input"><input value="Rack rebuild" id="dialog-title"></span></div>
      <div class="pb-field"><label class="pb-field__label" for="dialog-expires">Expires</label><span class="pb-select pb-demo-min-width-0"><select id="dialog-expires"><option>in 7 days</option><option>in 30 days</option><option>never</option></select></span></div>
    </div></div>
    <div class="pb-dialog__foot"><span class="pb-foot__status">6 files · 18.2 MB</span><button class="pb-btn pb-btn--ghost">Cancel</button><button class="pb-btn pb-btn--primary">Create link</button></div>
  </dialog>
  <dialog class="pb-dialog" id="dlg-form"><form method="dialog">
    <div class="pb-dialog__head"><div><h3 class="pb-dialog__title">New share</h3><p class="pb-dialog__sub">Anyone with the link can download.</p></div><button class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" value="cancel" aria-label="Close"><span class="pb-icon pb-icon--close"></span></button></div>
    <div class="pb-dialog__body"><div class="pb-form"><div class="pb-field"><label class="pb-field__label" for="dialog-title-2">Title</label><span class="pb-input"><input value="Rack rebuild" autofocus id="dialog-title-2"></span></div>
      <label class="pb-choice"><input type="checkbox" class="pb-check" checked><span>Require password</span></label></div></div>
    <div class="pb-dialog__foot"><button class="pb-btn pb-btn--ghost" value="cancel">Cancel</button><button class="pb-btn pb-btn--primary" value="ok">Create link</button></div></form></dialog>
  <dialog class="pb-dialog pb-dialog--lg pb-dialog--scroll" id="dlg-long"><form method="dialog">
    <div class="pb-dialog__head"><div><h3 class="pb-dialog__title">Release notes · 2.4.0</h3></div><button class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" value="cancel" aria-label="Close"><span class="pb-icon pb-icon--close"></span></button></div>
    <div class="pb-dialog__body pb-prose" data-long></div>
    <div class="pb-dialog__foot"><span class="pb-foot__status">Scroll for more</span><button class="pb-btn pb-btn--primary" value="ok">Got it</button></div></form></dialog>
  <dialog class="pb-dialog pb-dialog--drawer" id="dlg-drawer"><form method="dialog">
    <div class="pb-dialog__head"><div><h3 class="pb-dialog__title">Jellyfin</h3><p class="pb-dialog__sub">media.lab.home</p></div><button class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" value="cancel" aria-label="Close"><span class="pb-icon pb-icon--close"></span></button></div>
    <div class="pb-dialog__body"><div class="pb-form">
      <div class="pb-field"><label class="pb-field__label" for="dialog-upstream">Upstream</label><span class="pb-input"><span class="pb-input__affix">http://</span><input value="pve-01:8096" autofocus id="dialog-upstream"></span></div>
      <label class="pb-choice pb-demo-justify-content-space-between"><span>Expose to internet</span><input type="checkbox" role="switch" class="pb-switch" checked></label>
      <div class="pb-field"><label class="pb-field__label" for="dialog-notes">Notes</label><span class="pb-input"><textarea id="dialog-notes">Transcoding on the iGPU.</textarea></span></div></div></div>
    <div class="pb-dialog__foot"><button class="pb-btn pb-btn--ghost" value="cancel">Cancel</button><button class="pb-btn pb-btn--primary" value="ok">Save</button></div></form></dialog>
</div>
