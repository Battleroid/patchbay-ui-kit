<div style="display:grid;gap:12px;justify-items:start">
  <div class="pb-toolbar"><label class="pb-btn pb-btn--primary"><span class="pb-icon pb-icon--upload"></span>Add files<input type="file" multiple hidden data-upq-pick></label><button type="button" class="pb-btn" data-upq-demo>Simulate 5 uploads</button></div>
  <section class="pb-upq" data-upq aria-label="Uploads">
    <div class="pb-upq__head"><p class="pb-upq__title" role="status"></p>
      <button type="button" class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" data-upq-toggle aria-expanded="true" aria-label="Minimize"><span class="pb-icon pb-icon--chevron-down"></span></button></div>
    <div class="pb-upq__total"><span></span></div>
    <ul class="pb-upq__list"></ul>
    <div class="pb-upq__foot"><button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-upq-pause>Pause all</button><button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-upq-cancel-all>Cancel all</button><button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-upq-clear>Clear finished</button></div>
  </section>
</div>
