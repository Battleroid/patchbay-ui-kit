<div class="pb-cron" data-cron-builder data-cron="30 3 * * 1-5">
  <div class="pb-seg pb-seg--sm" role="radiogroup" aria-label="Preset" data-cron-preset style="justify-self:start">
    <label><input type="radio" name="cpre" value="hourly">hourly</label><label><input type="radio" name="cpre" value="daily">daily</label><label><input type="radio" name="cpre" value="weekly">weekly</label><label><input type="radio" name="cpre" value="monthly">monthly</label><label><input type="radio" name="cpre" value="custom">custom</label>
  </div>

  <div><span class="pb-eyebrow">next runs · local time</span><ol class="pb-cron__next" style="margin-top:6px"></ol></div>
</div>
