<div data-theme-scope style="display:grid;gap:16px;justify-items:start;padding:16px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--pb-r-lg)">
  <div class="pb-seg pb-seg--sm pb-themeswitch" role="radiogroup" aria-label="Theme" data-theme-switch>
    <label title="Light"><input type="radio" name="theme" value="light"><span class="pb-icon pb-icon--sun"></span>light</label>
    <label title="Dark"><input type="radio" name="theme" value="dark"><span class="pb-icon pb-icon--moon"></span>dark</label>
    <label title="Match system"><input type="radio" name="theme" value="system"><span class="pb-icon pb-icon--monitor"></span>system</label>
  </div>
  <div class="pb-seg pb-seg--icon pb-seg--sm pb-themeswitch" role="radiogroup" aria-label="Theme, compact" data-theme-switch>
    <label title="Light"><input type="radio" name="theme2" value="light" aria-label="Light"><span class="pb-icon pb-icon--sun"></span></label><label title="Dark"><input type="radio" name="theme2" value="dark" aria-label="Dark"><span class="pb-icon pb-icon--moon"></span></label><label title="System"><input type="radio" name="theme2" value="system" aria-label="System"><span class="pb-icon pb-icon--monitor"></span></label>
  </div>
  <div class="pb-card" style="padding:16px;justify-self:stretch"><div class="pb-card__head" style="margin-bottom:8px"><h3 class="pb-card__title">nas-01</h3><span class="pb-badge" data-status="ok"><span class="pb-icon"></span>up</span></div>
    <p style="margin:0 0 12px;font-size:15px;line-height:23px;color:var(--ink-muted)">This panel follows the switch above.</p>
    <div class="pb-toolbar"><button class="pb-btn pb-btn--primary pb-btn--sm">Restart</button><button class="pb-btn pb-btn--sm">Logs</button><span class="pb-pill pb-pill--yellow">beta</span></div></div>
</div>
