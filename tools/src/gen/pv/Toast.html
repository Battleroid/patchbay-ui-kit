<div style="display:grid;gap:20px">
  <div class="pb-toolbar">
    <button class="pb-btn pb-btn--sm" data-toast="ok">Saved</button>
    <button class="pb-btn pb-btn--sm" data-toast="undo">Deleted, with undo</button>
    <button class="pb-btn pb-btn--sm" data-toast="down">Failure</button>
    <button class="pb-btn pb-btn--sm" data-toast="busy">Upload</button>
    <button class="pb-btn pb-btn--sm" data-toast="ink">Ink</button>
  </div>
  <div class="pb-toasts pb-toasts--inline" role="region" aria-label="Notifications">
    <div class="pb-toast" data-status="ok" role="status"><span class="pb-icon pb-icon--status-ok"></span><p class="pb-toast__title">Share link copied</p><button type="button" class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" aria-label="Dismiss"><span class="pb-icon pb-icon--close"></span></button><span class="pb-toast__timer" style="--t:5s;transform:scaleX(.6)"></span></div>
    <div class="pb-toast" data-status="info" role="status"><span class="pb-icon pb-icon--status-info"></span><p class="pb-toast__title">3 files deleted</p><p class="pb-toast__body">They stay in trash for 30 days.</p><div class="pb-toast__actions"><button type="button" class="pb-btn pb-btn--sm">Undo</button></div><button type="button" class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" aria-label="Dismiss"><span class="pb-icon pb-icon--close"></span></button></div>
    <div class="pb-toast" data-status="down" role="alert"><span class="pb-icon pb-icon--status-down"></span><p class="pb-toast__title">Backup failed</p><p class="pb-toast__body">Offsite bucket refused the upload (403).</p><div class="pb-toast__actions"><button type="button" class="pb-btn pb-btn--sm">Retry</button><button type="button" class="pb-btn pb-btn--sm pb-btn--ghost">View log</button></div><button type="button" class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" aria-label="Dismiss"><span class="pb-icon pb-icon--close"></span></button></div>
    <div class="pb-toast" data-status="busy" role="status"><span class="pb-icon pb-icon--refresh pb-spin"></span><p class="pb-toast__title">Uploading 6 files…</p><p class="pb-toast__body">4 of 6 · 12.1 MB</p><button type="button" class="pb-btn pb-btn--ghost pb-btn--icon pb-btn--sm" aria-label="Dismiss"><span class="pb-icon pb-icon--close"></span></button></div>
  </div>
</div>
