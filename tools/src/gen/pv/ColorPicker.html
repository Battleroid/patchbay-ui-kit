<div class="pb-demo-display-grid-gap-20">
  <div class="pb-field"><span class="pb-field__label" id="lc-l">Label color</span>
    <div class="pb-swatches" role="radiogroup" aria-labelledby="lc-l" data-swatch-group>
      <button type="button" role="radio" class="pb-swatch" aria-checked="true" aria-label="Blue" data-vars="--c:var(--accent)"></button>
      <button type="button" role="radio" class="pb-swatch" aria-checked="false" aria-label="Red" data-vars="--c:var(--pop-red)"></button>
      <button type="button" role="radio" class="pb-swatch" aria-checked="false" aria-label="Yellow" data-vars="--c:var(--pop-yellow)"></button>
      <button type="button" role="radio" class="pb-swatch" aria-checked="false" aria-label="Mint" data-vars="--c:var(--pop-mint)"></button>
      <button type="button" role="radio" class="pb-swatch" aria-checked="false" aria-label="Green" data-vars="--c:var(--ok)"></button>
      <button type="button" role="radio" class="pb-swatch" aria-checked="false" aria-label="Ochre" data-vars="--c:var(--warn)"></button>
      <button type="button" role="radio" class="pb-swatch" aria-checked="false" aria-label="Ink" data-vars="--c:var(--ink)"></button>
      <button type="button" role="radio" class="pb-swatch" aria-checked="false" aria-label="Grey" data-vars="--c:var(--ink-muted)"></button>
    </div></div>
  <div class="pb-field pb-demo-max-width-240"><label class="pb-field__label" for="colorpicker-accent-for-this">Accent for this app</label>
    <span class="pb-input" data-colorfield><button type="button" class="pb-input__swatch" aria-label="Choose color" aria-haspopup="dialog" data-vars="--c:#1f3fd6"></button><input value="#1f3fd6" spellcheck="false" id="colorpicker-accent-for-this" aria-describedby="colorpicker-accent-for-this-help"></span>
    <span class="pb-field__help" id="colorpicker-accent-for-this-help">Pick a swatch or type a hex value.</span></div>
</div>
