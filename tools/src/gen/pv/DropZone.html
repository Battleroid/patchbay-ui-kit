<div style="display:grid;gap:16px">
  <label class="pb-drop"><input type="file" multiple>
    <span class="pb-icon pb-icon--upload pb-drop__icon"></span>
    <span class="pb-drop__title">Drop files to share</span>
    <span class="pb-drop__hint">or <u>browse</u> · images, video, archives up to 4 GB</span></label>
  <div class="pb-drop" data-state="over">
    <span class="pb-icon pb-icon--download pb-drop__icon"></span>
    <span class="pb-drop__title">Release to upload 3 files</span></div>
  <div class="pb-filelist">
    <div class="pb-filerow"><span class="pb-icon pb-icon--file"></span><span>rack-before.jpg</span><span class="pb-filerow__meta">4.1 MB · 62%</span>
      <div class="pb-progress" data-value="62"><span></span></div></div>
    <div class="pb-filerow"><span class="pb-icon pb-icon--status-ok" style="color:var(--ok)"></span><span>wiring.pdf</span><span class="pb-filerow__meta">820 KB · done</span></div>
  </div>
  <p class="pb-eyebrow" style="margin:8px 0 0">With upload settings</p>
  <div class="pb-dropset" data-dropset>
    <div class="pb-dropset__box">
      <button type="button" class="pb-dropset__bar" aria-expanded="false" aria-controls="dz-opts">
        <span class="pb-icon pb-icon--chevron-right pb-dropset__chev"></span>
        <span class="pb-dropset__summary" data-dropset-summary aria-live="polite"></span>
        <span class="pb-dropset__change">Change</span></button>
      <div class="pb-dropset__panel" id="dz-opts" hidden>
        <div class="pb-dropset__row"><span>Expires</span>
          <div class="pb-seg" role="radiogroup" aria-label="Expires"><label><input type="radio" name="dz-exp" value="1h" data-sum="expires {v}">1h</label><label><input type="radio" name="dz-exp" value="1d" data-sum="expires {v}">1d</label><label><input type="radio" name="dz-exp" value="7d" data-sum="expires {v}">7d</label><label><input type="radio" name="dz-exp" value="30d" data-sum="expires {v}" checked>30d</label><label><input type="radio" name="dz-exp" value="never" data-sum="never expires">never</label></div></div>
        <div class="pb-dropset__row"><span>Visibility</span>
          <span class="pb-select"><select aria-label="Visibility" data-sum="{v}"><option value="unlisted" selected>unlisted</option><option value="public">public</option><option value="private">private · signed-in only</option></select></span></div>
        <div class="pb-dropset__row"><span>File names</span>
          <div class="pb-seg" role="radiogroup" aria-label="File names"><label><input type="radio" name="dz-name" value="random" data-sum="random name" checked>random</label><label><input type="radio" name="dz-name" value="original" data-sum="original name">original</label></div></div>
        <div class="pb-dropset__row"><span>Password<small>People enter it before they see anything.</small></span>
          <input type="checkbox" class="pb-switch" aria-label="Password" data-sum-on="password" data-sum-off="no password" data-dropset-reveal="dz-pw"></div>
        <div class="pb-dropset__sub" id="dz-pw" hidden><span class="pb-input"><span class="pb-icon pb-icon--key"></span><input type="password" placeholder="at least 8 characters" aria-label="Share password" autocomplete="new-password"></span></div>
        <div class="pb-dropset__row"><span>Strip photo location<small>Removes GPS from image metadata.</small></span>
          <input type="checkbox" class="pb-switch" aria-label="Strip photo location" checked data-sum-on="" data-sum-off="keeps location"></div>
        <div class="pb-dropset__foot"><button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-dropset-reset>Reset</button><button type="button" class="pb-btn pb-btn--sm" data-dropset-default>Save as default</button></div>
      </div>
    </div>
    <label class="pb-drop"><input type="file" multiple>
      <span class="pb-icon pb-icon--upload pb-drop__icon"></span>
      <span class="pb-drop__title">Drop files to share</span>
      <span class="pb-drop__hint">or <u>browse</u> · paste an image · up to 4 GB each</span></label>
  </div>
  <p class="pb-eyebrow" style="margin:8px 0 0">Compact settings</p>
  <div class="pb-dropset pb-dropset--compact" data-dropset>
    <div class="pb-dropset__box">
      <button type="button" class="pb-dropset__bar" aria-expanded="true" aria-controls="dz2-opts">
        <span class="pb-icon pb-icon--chevron-right pb-dropset__chev"></span>
        <span class="pb-dropset__summary" data-dropset-summary aria-live="polite"></span>
        <span class="pb-dropset__change">Change</span></button>
      <div class="pb-dropset__panel" id="dz2-opts">
        <div class="pb-dropset__field"><span class="pb-dropset__label" id="dz2-exp-l">Expires</span>
          <div class="pb-seg" role="radiogroup" aria-labelledby="dz2-exp-l"><label><input type="radio" name="dz2-exp" value="1h" data-sum="expires {v}">1h</label><label><input type="radio" name="dz2-exp" value="1d" data-sum="expires {v}">1d</label><label><input type="radio" name="dz2-exp" value="7d" data-sum="expires {v}">7d</label><label><input type="radio" name="dz2-exp" value="30d" data-sum="expires {v}" checked>30d</label><label><input type="radio" name="dz2-exp" value="never" data-sum="never expires">never</label></div></div>
        <label class="pb-dropset__field"><span class="pb-dropset__label">Visibility</span>
          <span class="pb-select"><select data-sum="{v}"><option value="unlisted" selected>unlisted</option><option value="public">public</option><option value="private">private · signed-in only</option></select></span></label>
        <div class="pb-dropset__field"><span class="pb-dropset__label" id="dz2-name-l">File names</span>
          <div class="pb-seg" role="radiogroup" aria-labelledby="dz2-name-l"><label><input type="radio" name="dz2-name" value="random" data-sum="random name" checked>random</label><label><input type="radio" name="dz2-name" value="original" data-sum="original name">original</label></div></div>
        <label class="pb-dropset__field pb-dropset__field--switch"><input type="checkbox" class="pb-switch" checked data-sum-on="" data-sum-off="keeps location"><span>Strip photo location</span></label>
        <label class="pb-dropset__field pb-dropset__field--switch"><input type="checkbox" class="pb-switch" data-sum-on="password" data-sum-off="no password" data-dropset-enable="dz2-pw"><span>Password</span></label>
        <div class="pb-dropset__field pb-dropset__field--end" id="dz2-pw" data-off><span class="pb-input"><span class="pb-icon pb-icon--key"></span><input type="password" placeholder="at least 8 characters" aria-label="Share password" autocomplete="new-password" disabled></span></div>
        <div class="pb-dropset__foot"><button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-dropset-reset>Reset</button><button type="button" class="pb-btn pb-btn--sm" data-dropset-default>Save as default</button></div>
      </div>
    </div>
    <label class="pb-drop pb-drop--slim"><input type="file" multiple>
      <span class="pb-icon pb-icon--upload pb-drop__icon"></span>
      <span class="pb-drop__title">Drop files to share</span>
      <span class="pb-drop__hint">or <u>browse</u> · up to 4 GB each</span></label>
  </div>
</div>
