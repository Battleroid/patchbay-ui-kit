<div style="display:grid;gap:20px">
  <div class="pb-field"><span class="pb-field__label" id="otp-l">Authenticator code</span>
    <div class="pb-otp" role="group" aria-labelledby="otp-l" aria-describedby="otp-help" data-codeinput data-name="code"><input inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Digit 1"><input inputmode="numeric" maxlength="1" aria-label="Digit 2"><input inputmode="numeric" maxlength="1" aria-label="Digit 3"><span class="pb-otp__sep" aria-hidden="true"></span><input inputmode="numeric" maxlength="1" aria-label="Digit 4"><input inputmode="numeric" maxlength="1" aria-label="Digit 5"><input inputmode="numeric" maxlength="1" aria-label="Digit 6"></div>
    <span class="pb-field__help" id="otp-help">Six digits from your authenticator app. Pasting works.</span></div>
  <div class="pb-field" data-invalid><span class="pb-field__label" id="otp2-l">Wrong code</span>
    <div class="pb-otp" role="group" aria-labelledby="otp2-l" aria-describedby="otp2-error"><input value="4" maxlength="1" aria-label="Digit 1"><input value="1" maxlength="1" aria-label="Digit 2"><input value="9" maxlength="1" aria-label="Digit 3"><span class="pb-otp__sep" aria-hidden="true"></span><input value="0" maxlength="1" aria-label="Digit 4"><input value="2" maxlength="1" aria-label="Digit 5"><input value="7" maxlength="1" aria-label="Digit 6"></div>
    <span class="pb-field__error" id="otp2-error"><span class="pb-icon pb-icon--status-down pb-icon--16" aria-hidden="true"></span>That code expired. Try the next one.</span></div>
</div>
