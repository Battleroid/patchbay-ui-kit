<div style="display:grid;gap:28px">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;justify-items:center">
  <figure class="pb-dial" data-gauge data-value="34" data-max="100" data-warn="80" data-down="95" data-unit="%"><figcaption>CPU<small>pve-01 · 32 threads</small></figcaption></figure>
  <figure class="pb-dial" data-gauge data-value="87.5" data-max="128" data-warn="96" data-down="120" data-unit="GB" data-live><figcaption>Memory<small>pve-02</small></figcaption></figure>
  <figure class="pb-dial" data-gauge data-value="61" data-min="20" data-max="70" data-warn="50" data-down="60" data-unit="°C"><figcaption>NVMe temp<small>nas-01 · nvme0</small></figcaption></figure>
</div>
<figure class="pb-donut" data-gauge-donut data-total="6.2 TB" data-total-label="used">
  <div class="pb-donut__hole"></div>
  <ul class="pb-donut__legend">
    <li data-value="3.1" data-vars="--c:var(--chart-1)"><i></i><span>media</span><span>3.1 TB</span><span data-pct></span></li>
    <li data-value="1.7" data-vars="--c:var(--pop-mint)"><i></i><span>photos</span><span>1.7 TB</span><span data-pct></span></li>
    <li data-value="1.4" data-vars="--c:var(--pop-yellow)"><i></i><span>backups</span><span>1.4 TB</span><span data-pct></span></li>
  </ul>
</figure>
<figure class="pb-donut" data-gauge-donut data-total-label="clients">
  <div class="pb-donut__hole"></div>
  <ul class="pb-donut__legend">
    <li data-value="23" data-vars="--c:var(--chart-1)"><i></i><span>wired</span><span>23</span><span data-pct></span></li>
    <li data-value="31" data-vars="--c:var(--chart-2)"><i></i><span>wifi</span><span>31</span><span data-pct></span></li>
    <li data-value="6" data-vars="--c:var(--chart-3)"><i></i><span>iot vlan</span><span>6</span><span data-pct></span></li>
  </ul>
</figure>
</div>
