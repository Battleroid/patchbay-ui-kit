<div style="display:grid;gap:16px">
  <div class="pb-field"><label class="pb-field__label" for="select-pool">Pool</label>
    <span class="pb-select"><select id="select-pool"><option>tank</option><option>fast</option><option>backup</option></select></span></div>
  <div class="pb-field"><label class="pb-field__label" for="select-image-tag">Image tag</label>
    <span class="pb-select"><select id="select-image-tag"><optgroup label="stable"><option>10.10.3</option><option>10.10.2</option></optgroup><optgroup label="unstable"><option>nightly</option></optgroup></select></span></div>
  <div class="pb-field"><label class="pb-field__label" for="select-hosts">Hosts</label>
    <span class="pb-select pb-select--multi"><select multiple size="4" id="select-hosts" aria-describedby="select-hosts-help"><option selected>nas-01</option><option>pve-01</option><option selected>pi-dns</option><option>router</option></select></span>
    <span class="pb-field__help" id="select-hosts-help">⌘-click to pick several.</span></div>
  <div class="pb-field"><label class="pb-field__label" for="select-timezone-with-suggestions">Timezone (with suggestions)</label>
    <span class="pb-input"><input list="tz" placeholder="America/New_York" id="select-timezone-with-suggestions"><span class="pb-icon pb-icon--chevron-down"></span></span>
    <datalist id="tz"><option value="America/New_York"></option><option value="Europe/Berlin"></option><option value="UTC"></option></datalist></div>
</div>
