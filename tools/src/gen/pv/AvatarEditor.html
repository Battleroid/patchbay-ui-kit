<div class="pb-demo-avatareditor-1">

        <label class="pb-btn pb-btn--sm"><input type="file" class="pb-sr" accept="image/png,image/jpeg,image/webp" data-avatar-pick aria-describedby="avatareditor-hint-1"><span class="pb-icon pb-icon--upload"></span><span data-label>Upload photo</span></label>
        <button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-avatar-remove hidden>Remove</button>
        <button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-demo-sample>Try a sample photo</button>
      </div>
    </div>
  </div>
  <p class="pb-eyebrow pb-demo-margin-8-0-0">With a photo and a presence dot</p>
  <div class="pb-avfield" data-avatar-edit data-demo-fail>
    <span class="pb-avatar pb-avatar--xl" data-avatar data-name="Sam Okafor"><img src="{{THUMB4}}" alt=""><span class="pb-dot" data-status="ok"></span></span>
    <div class="pb-avfield__body">
      <span class="pb-avfield__title">Profile photo</span>
      <span class="pb-avfield__hint" id="avatareditor-hint-2" aria-live="polite">The first save here fails, to show the error.</span>

        <label class="pb-btn pb-btn--sm"><input type="file" class="pb-sr" accept="image/png,image/jpeg,image/webp" data-avatar-pick aria-describedby="avatareditor-hint-2"><span class="pb-icon pb-icon--upload"></span><span data-label>Change photo</span></label>
        <button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-avatar-remove>Remove</button>
        <button type="button" class="pb-btn pb-btn--ghost pb-btn--sm" data-demo-sample>Try a sample photo</button>
      </div>
    </div>
