<div style="display:grid;gap:28px">
<div class="pb-storage" data-storage>
  <div class="pb-storage__head"><span class="pb-storage__name">tank</span><span class="pb-badge" data-status="ok"><span class="pb-icon"></span>healthy</span><span class="pb-storage__total"><b>6.2 TB</b> of 10.9 TB · 57%</span></div>
  <div class="pb-storage__bar" role="img" aria-label="tank: media 3.1 TB, photos 1.7 TB, backups 1.4 TB, free 4.7 TB">
    <span data-key="media" style="--w:28.4%;--c:var(--chart-1)"></span><span data-key="photos" style="--w:15.6%;--c:var(--pop-mint)"></span><span data-key="backups" style="--w:12.8%;--c:var(--pop-yellow)"></span>
    <i class="pb-storage__mark" style="--at:80%" title="80% warning"></i>
  </div>
  <ul class="pb-storage__legend">
    <li data-key="media"><i style="--c:var(--chart-1)"></i><span>media</span><span>3.1 TB</span></li>
    <li data-key="photos"><i style="--c:var(--pop-mint)"></i><span>photos</span><span>1.7 TB</span></li>
    <li data-key="backups"><i style="--c:var(--pop-yellow)"></i><span>backups</span><span>1.4 TB</span></li>
    <li data-free><i></i><span>free</span><span>4.7 TB</span></li>
  </ul>
</div>
<div class="pb-storage" data-storage>
  <div class="pb-storage__head"><span class="pb-storage__name">fast</span><span class="pb-badge" data-status="warn"><span class="pb-icon"></span>86% full</span><span class="pb-storage__total"><b>1.2 TB</b> of 1.4 TB</span></div>
  <div class="pb-storage__bar" role="img" aria-label="fast: postgres 620 GB, vms 410 GB, cache 170 GB, free 200 GB">
    <span data-key="pg" style="--w:44.3%;--c:var(--chart-1)"></span><span data-key="vm" style="--w:29.3%;--c:var(--pop-red)"></span><span data-key="cache" style="--w:12.1%;--c:var(--chart-3)"></span>
    <i class="pb-storage__mark" style="--at:80%"></i><i class="pb-storage__mark" data-status="down" style="--at:90%"></i>
  </div>
  <ul class="pb-storage__legend">
    <li data-key="pg"><i style="--c:var(--chart-1)"></i><span>postgres</span><span>620 GB</span></li>
    <li data-key="vm"><i style="--c:var(--pop-red)"></i><span>vms</span><span>410 GB</span></li>
    <li data-key="cache"><i style="--c:var(--chart-3)"></i><span>cache</span><span>170 GB</span></li>
    <li data-free><i></i><span>free</span><span>200 GB</span></li>
  </ul>
</div>
<div class="pb-storage pb-storage--compact" data-storage>
  <div class="pb-storage__head"><span class="pb-storage__name">backup</span><span class="pb-storage__total"><b>3.4 TB</b> of 8 TB · 43%</span></div>
  <div class="pb-storage__bar pb-storage__bar--joined" role="img" aria-label="backup: restic 2.1 TB, proxmox 0.9 TB, photos 0.4 TB, free 4.6 TB">
    <span data-key="r" style="--w:26.3%;--c:var(--chart-1)"></span><span data-key="x" style="--w:11.2%;--c:var(--pop-red)"></span><span data-key="o" style="--w:5%;--c:var(--pop-yellow)"></span>
    <i class="pb-storage__mark" style="--at:80%"></i>
  </div>
  <ul class="pb-storage__legend">
    <li data-key="r"><i style="--c:var(--chart-1)"></i><span>restic</span><span>2.1 TB</span></li>
    <li data-key="x"><i style="--c:var(--pop-red)"></i><span>proxmox</span><span>0.9 TB</span></li>
    <li data-key="o"><i style="--c:var(--pop-yellow)"></i><span>photos</span><span>0.4 TB</span></li>
    <li data-free><i></i><span>free</span><span>4.6 TB</span></li>
  </ul>
</div>
</div>
