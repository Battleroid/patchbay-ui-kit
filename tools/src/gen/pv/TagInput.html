<div style="display:grid;gap:20px">
  <div class="pb-field"><label class="pb-field__label" for="taginput-allowed-networks">Allowed networks</label>
    <span class="pb-input pb-tags" data-tags data-pattern="\d{1,3}(\.\d{1,3}){3}/\d{1,2}" data-pattern-error="Use a network like 10.0.20.0/24."><span class="pb-tag">10.0.0.0/16<button type="button" aria-label="Remove 10.0.0.0/16"><span class="pb-icon pb-icon--close"></span></button></span><span class="pb-tag">100.64.0.0/10<button type="button" aria-label="Remove 100.64.0.0/10"><span class="pb-icon pb-icon--close"></span></button></span><input placeholder="Add CIDR…" id="taginput-allowed-networks" aria-describedby="taginput-allowed-networks-help"></span>
    <span class="pb-field__help" id="taginput-allowed-networks-help">Enter or comma adds; Backspace removes the last.</span></div>
  <div class="pb-field"><label class="pb-field__label" for="taginput-share-with">Share with</label>
    <span class="pb-input pb-tags" data-tags><span class="pb-tag">casey<button type="button" aria-label="Remove casey"><span class="pb-icon pb-icon--close"></span></button></span><input placeholder="username" id="taginput-share-with"></span></div>
  <form class="pb-field" data-test="tags-form"><label class="pb-field__label" for="taginput-labels">Labels (submitted as one field)</label>
    <span class="pb-input pb-tags" data-tags data-name="labels" data-sep=","><input id="taginput-labels" placeholder="Add label…"></span></form>
</div>
