<div style="display:grid;gap:20px">
  <label class="pb-field"><span class="pb-field__label">Allowed networks</span>
    <span class="pb-input pb-tags" data-tags><span class="pb-tag">10.0.0.0/16<button type="button" aria-label="Remove 10.0.0.0/16"><span class="pb-icon pb-icon--close"></span></button></span><span class="pb-tag">100.64.0.0/10<button type="button" aria-label="Remove 100.64.0.0/10"><span class="pb-icon pb-icon--close"></span></button></span><input placeholder="Add CIDR…" aria-label="Add network"></span>
    <span class="pb-field__help">Enter or comma adds; Backspace removes the last.</span></label>
  <label class="pb-field"><span class="pb-field__label">Share with</span>
    <span class="pb-input pb-tags" data-tags><span class="pb-tag">casey<button type="button" aria-label="Remove casey"><span class="pb-icon pb-icon--close"></span></button></span><input placeholder="username" aria-label="Add user"></span></label>
  <form class="pb-field" data-test="tags-form"><span class="pb-field__label">Labels (submitted as one field)</span>
    <span class="pb-input pb-tags" data-tags data-name="labels" data-sep=","><input aria-label="Add label" placeholder="Add label…"></span></form>
</div>
